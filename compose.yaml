services:
  karakeep-tagger:
    build: .
    container_name: karakeep-tagger
    restart: unless-stopped
    ports:
      # Host address and port to publish on; set TAGGER_PUBLISH in .env to change it
      - "${TAGGER_PUBLISH:-127.0.0.1:8080}:8080"
    # Settings (KARAKEEP_URL, KARAKEEP_API_KEY, TAGGER_HOSTS, ...): see .env.example
    env_file: .env
